name: kptv

services:
  server:
    build: ./src
    image: kptv-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_BIND_HOST: 0.0.0.0
      SERVER_BIND_PORT: '8000'
      SERVER_PROXY_HEADERS: 'true'
      SERVER_SQLITE_URL: /data/kp-sqlite.db
      # The admin panel listens on a second port INSIDE the container; it is
      # published on the host loopback only — reachable via an SSH tunnel,
      # never from the internet.
      SERVER_ADMIN_BIND_HOST: 0.0.0.0
      SERVER_ADMIN_PORT: '8001'
    ports:
      - '127.0.0.1:${KPTV_ADMIN_PORT:-8001}:8001'
    volumes:
      - ./data:/data
      - ./backups:/backups
      # The SPA lives outside the src/ build context; mount it so the app
      # serves /client/ in production too (main.py picks it up at /client).
      - ./client:/client:ro
    expose:
      - '8000'
    # json-file logs grow without bounds otherwise; the app logs little,
    # but «little × months» still fills a small VPS disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${KPTV_HTTP_PORT:-80}:80'
      - '${KPTV_HTTPS_PORT:-443}:443'
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certificate issued as --cert-name kptv
      - ./data/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
