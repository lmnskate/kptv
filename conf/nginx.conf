# HTTPS only: the app on :443; :80 only redirects to https.
# The certificate is issued under the fixed certbot name "kptv".
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/kptv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kptv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KPTV_SSL:10m;
    ssl_session_timeout 1d;

    # re-resolve the app container's IP at request time (Docker DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8000;

    location / {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
