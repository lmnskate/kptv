<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPTV — управление</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #0b111a;
        --panel: #101a26;
        --panel-2: #0d1622;
        --line: #1e2c3d;
        --text: #d7e1ec;
        --muted: #7286a0;
        --accent: #4f8fdd;
        --ok: #7fd08a;
        --danger: #e08181;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    svg.icon {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: 0 0 auto;
    }
    header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 17px; font-weight: 600; }
    header .spacer { flex: 1; }
    main { padding: 22px 28px 60px; max-width: 1240px; margin: 0 auto; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .muted { color: var(--muted); }
    .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px 20px;
    }
    .center-box { max-width: 400px; margin: 70px auto; text-align: center; }
    .center-box p { text-align: left; }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        background: #1a2b3f;
        color: var(--text);
        border: 1px solid #2d4258;
        border-radius: 6px;
        padding: 0 12px;
        cursor: pointer;
        font-size: 13px;
        font-family: inherit;
        white-space: nowrap;
    }
    .btn:hover { background: #24405d; }
    .btn-danger { border-color: #5d3440; color: var(--danger); background: #221318; }
    .btn-danger:hover { background: #33191f; }
    .btn + .btn { margin-left: 8px; }
    .link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: none;
        border: none;
        padding: 0;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
    }
    .link:hover { text-decoration: underline; }

    .toolbar { display: flex; align-items: center; gap: 16px; margin: 0 0 12px; }
    .toolbar .summary { color: var(--muted); font-size: 13px; }
    .toolbar .spacer { flex: 1; }
    #filter-input {
        width: 260px;
        padding: 7px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        font-size: 13px;
    }
    #filter-input:focus { outline: none; border-color: var(--accent); }

    table { width: 100%; border-collapse: collapse; }
    .devices-table { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 14px; border-bottom: 1px solid #16222f; vertical-align: middle; }
    th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
        text-align: left;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.device-row:hover td { background: #12202f; }
    .col-status { width: 70px; text-align: center; }
    .col-date { width: 150px; text-align: center; }
    .col-history { width: 90px; text-align: center; }
    .col-actions { width: 330px; text-align: right; white-space: nowrap; }
    th.col-status, th.col-date, th.col-history, th.col-actions { text-align: inherit; }
    .devices-table table { table-layout: fixed; }
    .status-yes { color: var(--ok); }
    .status-no { color: var(--danger); }
    .device-id { display: flex; align-items: center; gap: 8px; }
    .device-id span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .device-ua {
        margin-top: 2px;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .history-panel td { background: var(--panel-2); padding: 14px 20px; }
    .history-table th { border-bottom: 1px solid var(--line); padding: 6px 10px; }
    .history-table td { border-bottom: 1px solid #14202e; padding: 8px 10px; }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table a { color: var(--text); text-decoration: none; font-weight: 500; }
    .history-table a:hover { text-decoration: underline; color: var(--accent); }
    .hist-sub { font-size: 12px; margin-top: 2px; }
    .more-wrap { padding: 10px 0 2px; }

    #toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 20px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: 80%;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: #6d3039; color: var(--danger); }

    #modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(4, 8, 14, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
    }
    .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px 22px;
        width: 380px;
        max-width: calc(100vw - 40px);
    }
    .modal h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .modal p { margin: 0 0 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .hidden { display: none !important; }
</style>
</head>
<body>
<header>
    <h1>KPTV</h1>
    <span class="spacer"></span>
    <button id="btn-token" class="link hidden">Токен</button>
    <button id="btn-import" class="btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Импорт БД
    </button>
    <button id="btn-export" class="btn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Экспорт БД
    </button>
    <button id="btn-refresh" class="btn">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Обновить
    </button>
    <input type="file" id="import-file" accept=".db" class="hidden">
</header>
<main>
    <div id="token-box" class="card center-box hidden">
        <h2>Токен</h2>
        <p><input id="token-input" type="password" placeholder="Токен" autocomplete="off"
            style="width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit"></p>
        <button id="btn-token-save" class="btn">Войти</button>
    </div>
    <div id="error-box" class="card center-box hidden">
        <h2>Ошибка</h2>
        <p id="error-text" class="muted"></p>
        <button id="btn-retry" class="btn">Повторить</button>
    </div>
    <div id="loading-box" class="card center-box hidden"><p class="muted">Загрузка…</p></div>
    <div id="empty-box" class="card center-box hidden"><p class="muted">Устройств нет</p></div>

    <div id="devices-box" class="hidden">
        <div class="toolbar">
            <span class="summary" id="summary"></span>
            <span class="spacer"></span>
            <input id="filter-input" type="text" placeholder="Поиск" autocomplete="off">
        </div>
        <div class="devices-table">
            <table>
                <thead>
                <tr>
                    <th>Устройство</th>
                    <th class="col-status" style="text-align:center">Статус</th>
                    <th class="col-date" style="text-align:center">Создано</th>
                    <th class="col-history" style="text-align:center">История</th>
                    <th class="col-actions" style="text-align:center">Действия</th>
                </tr>
                </thead>
                <tbody id="devices-body"></tbody>
            </table>
        </div>
    </div>
</main>

<div id="modal-overlay" class="hidden">
    <div class="modal">
        <h3 id="modal-title"></h3>
        <p id="modal-text" class="muted"></p>
        <div class="modal-actions">
            <button id="modal-cancel" class="btn">Отмена</button>
            <button id="modal-ok" class="btn"></button>
        </div>
    </div>
</div>
<div id="toast"></div>
<script>
var TOKEN_KEY = 'kptv-admin-token';
var token = sessionStorage.getItem(TOKEN_KEY) || '';
var devicesData = [];

var SVG = {
    check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
    cross: '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    clock: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    trash: '<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    reset: '<svg class="icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
    copy: '<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
};

function esc(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function show(id) {
    var ids = ['token-box', 'error-box', 'loading-box', 'empty-box', 'devices-box'];
    for (var i = 0; i < ids.length; i++) {
        document.getElementById(ids[i]).classList.toggle('hidden', ids[i] !== id);
    }
}

var toastTimer = null;
function toast(text, isError) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
        el.classList.remove('show');
    }, 2500);
}

var modalOkHandler = null;
function confirmModal(title, text, okLabel, isDanger, onOk) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-text').textContent = text;
    var okBtn = document.getElementById('modal-ok');
    okBtn.textContent = okLabel;
    okBtn.className = isDanger ? 'btn btn-danger' : 'btn';
    modalOkHandler = onOk;
    document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    modalOkHandler = null;
}

document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-ok').addEventListener('click', function () {
    var handler = modalOkHandler;
    closeModal();
    if (handler) handler();
});
document.getElementById('modal-overlay').addEventListener('click', function (event) {
    if (event.target === this) closeModal();
});
document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' &&
        !document.getElementById('modal-overlay').classList.contains('hidden')) {
        closeModal();
    }
});

function fmtDate(ts) {
    if (!ts) return '—';
    var d = new Date(ts * 1000);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function fmtDateOnly(ts) {
    if (!ts) return '—';
    var d = new Date(ts * 1000);
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
}

function request(method, url, body, onOk, onFail) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    if (body !== null && body !== undefined) {
        xhr.setRequestHeader('Content-Type', 'application/json');
    }
    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 401) {
            show('token-box');
            document.getElementById('btn-token').classList.remove('hidden');
            return;
        }
        if (xhr.status >= 200 && xhr.status < 300) {
            var data = null;
            try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; }
            catch (e) { data = null; }
            if (onOk) onOk(data);
            return;
        }
        var message = 'HTTP ' + xhr.status;
        try {
            var parsed = JSON.parse(xhr.responseText);
            if (parsed && parsed.error && parsed.error.message) message = parsed.error.message;
        } catch (e) {}
        if (onFail) onFail(message);
        else toast(message, true);
    };
    xhr.onerror = function () {
        var message = 'Нет связи с сервером';
        if (onFail) onFail(message);
        else toast(message, true);
    };
    xhr.send(body !== null && body !== undefined ? JSON.stringify(body) : null);
}

function loadDevices() {
    show('loading-box');
    request('GET', '/api/devices', null, function (data) {
        devicesData = data.devices || [];
        renderDevices();
    }, function (message) {
        document.getElementById('error-text').textContent = message;
        show('error-box');
    });
}

function renderDevices() {
    var query = document.getElementById('filter-input').value.trim().toLowerCase();
    var shown = [];
    for (var i = 0; i < devicesData.length; i++) {
        var d = devicesData[i];
        var haystack = (d.id + ' ' + (d.user_agent || '')).toLowerCase();
        if (!query || haystack.indexOf(query) !== -1) shown.push(d);
    }

    document.getElementById('summary').textContent = 'Устройств: ' +
        (query ? shown.length + ' из ' + devicesData.length : devicesData.length);

    var html = '';
    for (var j = 0; j < shown.length; j++) {
        var dev = shown[j];
        html += '<tr class="device-row">';
        html += '<td><div class="device-id mono"><span>' + esc(dev.id) + '</span>' +
            '<button class="link" data-copy="' + esc(dev.id) + '" title="Скопировать ID">' + SVG.copy + '</button></div>' +
            '<div class="device-ua muted" title="' + esc(dev.user_agent || '') + '">' +
            esc(dev.user_agent || '') + '</div></td>';
        html += '<td class="col-status"><span class="' + (dev.registered ? 'status-yes' : 'status-no') + '" ' +
            'title="' + (dev.registered ? 'Активировано' : 'Не активировано') + '">' +
            (dev.registered ? SVG.check : SVG.cross) + '</span></td>';
        html += '<td class="col-date mono">' + esc(fmtDate(dev.created_at)) + '</td>';
        html += '<td class="col-history"><button class="link" data-history="' + esc(dev.id) + '" data-hcount-btn="' + esc(dev.id) + '" ' +
            'title="История">' + SVG.clock + ' <span>' + (dev.history_rows || 0) + '</span></button></td>';
        html += '<td class="col-actions">' +
            '<button class="btn" data-reset="' + esc(dev.id) + '">' + SVG.reset + 'Сбросить настройки</button> ' +
            '<button class="btn btn-danger" data-delete="' + esc(dev.id) + '">' + SVG.trash + 'Удалить</button>' +
            '</td>';
        html += '</tr>';
        html += '<tr class="history-panel hidden" id="hist-' + esc(dev.id) + '">' +
            '<td colspan="5"></td></tr>';
    }
    document.getElementById('devices-body').innerHTML = html ||
        '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px">Ничего не найдено</td></tr>';

    if (!devicesData.length) show('empty-box');
    else show('devices-box');
}

function historyRows(items, deviceId) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
        var h = items[i];
        var title = h.title || ('item ' + h.item_id);
        var subtitle = (h.season || h.episode)
            ? '<div class="hist-sub muted">Сезон ' + h.season + ' · Серия ' + h.episode + '</div>'
            : '';
        html += '<tr>' +
            '<td><a href="https://kino.pub/item/' + h.item_id + '" target="_blank" rel="noopener">' + esc(title) + '</a>' +
                subtitle + '</td>' +
            '<td class="mono" style="text-align:center">' + esc(fmtDateOnly(h.updated_at)) + '</td>' +
            '<td style="text-align:right"><button class="btn btn-danger" data-delhist="' + esc(deviceId) + '|' +
            h.item_id + '|' + h.season + '|' + h.episode + '">' + SVG.trash + 'Удалить</button></td>' +
            '</tr>';
    }
    return html;
}

function historyShell(items, deviceId) {
    return '<table class="history-table"><thead><tr>' +
        '<th>Название</th><th class="col-date" style="text-align:center">Дата</th>' +
        '<th style="text-align:right">Действия</th>' +
        '</tr></thead><tbody>' + historyRows(items, deviceId) + '</tbody></table>' +
        '<div class="more-wrap"></div>';
}

function loadHistory(deviceId, page) {
    var panel = document.getElementById('hist-' + deviceId);
    var cell = panel.querySelector('td');
    request('GET', '/api/devices/' + encodeURIComponent(deviceId) +
        '/history?page=' + page, null, function (data) {
        panel.dataset.page = page;
        if (page === 1 || !cell.querySelector('.history-table')) {
            cell.innerHTML = data.items.length
                ? historyShell(data.items, deviceId)
                : '<p class="muted">Пусто</p>';
        } else {
            cell.querySelector('.history-table tbody')
                .insertAdjacentHTML('beforeend', historyRows(data.items, deviceId));
        }
        var moreWrap = cell.querySelector('.more-wrap');
        if (moreWrap) {
            moreWrap.innerHTML = data.has_more
                ? '<button class="link" data-morehist="' + esc(deviceId) + '|' +
                    (data.page + 1) + '">Ещё…</button>'
                : '';
        }
    });
}

function setHistoryCount(deviceId, count) {
    var btn = document.querySelector('[data-hcount-btn="' + CSS.escape(deviceId) + '"]');
    if (btn) btn.innerHTML = SVG.clock + ' <span>' + count + '</span>';
    for (var i = 0; i < devicesData.length; i++) {
        if (devicesData[i].id === deviceId) devicesData[i].history_rows = count;
    }
}

function deleteHistoryEntry(hp) {
    request('DELETE', '/api/devices/' + encodeURIComponent(hp[0]) + '/history', {
        item_id: parseInt(hp[1], 10),
        season: parseInt(hp[2], 10),
        episode: parseInt(hp[3], 10)
    }, function () {
        toast('Запись удалена');
        loadHistory(hp[0], 1);
        var counter = document.querySelector('[data-hcount-btn="' + CSS.escape(hp[0]) + '"]');
        if (counter) {
            var current = parseInt(counter.textContent, 10) || 0;
            setHistoryCount(hp[0], Math.max(0, current - 1));
        }
    });
}

document.addEventListener('click', function (event) {
    var target = event.target instanceof Element
        ? event.target.closest('[data-copy],[data-history],[data-morehist],[data-delhist],[data-reset],[data-delete]')
        : null;
    if (!target) return;

    if (target.dataset.copy) {
        copyText(target.dataset.copy);
    } else if (target.dataset.history) {
        var deviceId = target.dataset.history;
        var panel = document.getElementById('hist-' + deviceId);
        panel.classList.toggle('hidden');
        if (!panel.classList.contains('hidden') && !panel.dataset.loaded) {
            panel.dataset.loaded = '1';
            loadHistory(deviceId, 1);
        }
    } else if (target.dataset.morehist) {
        var parts = target.dataset.morehist.split('|');
        loadHistory(parts[0], parseInt(parts[1], 10) || 2);
    } else if (target.dataset.delhist) {
        var hp = target.dataset.delhist.split('|');
        confirmModal('Удалить запись?', 'Запись истории будет удалена безвозвратно.', 'Удалить', true,
            function () {
                deleteHistoryEntry(hp);
            });
    } else if (target.dataset.reset) {
        var resetId = target.dataset.reset;
        confirmModal('Сбросить настройки?', 'Настройки устройства вернутся к значениям по умолчанию.', 'Сбросить', false,
            function () {
                request('POST', '/api/devices/' + encodeURIComponent(resetId) + '/reset', null,
                    function () {
                        toast('Настройки сброшены');
                        loadDevices();
                    });
            });
    } else if (target.dataset.delete) {
        var deleteId = target.dataset.delete;
        confirmModal('Удалить устройство?', 'Устройство потеряет доступ, его история будет стёрта.', 'Удалить', true,
            function () {
                request('DELETE', '/api/devices/' + encodeURIComponent(deleteId), null, function () {
                    toast('Устройство удалено');
                    loadDevices();
                });
            });
    }
});

function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
            toast('Скопировано');
        }, function () {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    var area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    try {
        document.execCommand('copy');
        toast('Скопировано');
    } catch (e) {
        toast('Не удалось скопировать', true);
    }
    document.body.removeChild(area);
}

document.getElementById('btn-refresh').addEventListener('click', loadDevices);
document.getElementById('btn-retry').addEventListener('click', loadDevices);
document.getElementById('filter-input').addEventListener('input', renderDevices);
document.getElementById('btn-token').addEventListener('click', function () {
    show('token-box');
});
document.getElementById('btn-token-save').addEventListener('click', function () {
    token = document.getElementById('token-input').value.trim();
    sessionStorage.setItem(TOKEN_KEY, token);
    loadDevices();
});
document.getElementById('token-input').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') document.getElementById('btn-token-save').click();
});

document.getElementById('btn-export').addEventListener('click', function () {
    var url = '/api/database/export';
    if (token) url += '?token=' + encodeURIComponent(token);
    window.location.href = url;
});
document.getElementById('btn-import').addEventListener('click', function () {
    document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', function () {
    var input = this;
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    confirmModal('Импорт базы?', 'Текущая база данных будет заменена.', 'Импортировать', true, function () {
        var form = new FormData();
        form.append('file', file);
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/database/import', true);
        if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 401) {
                show('token-box');
                document.getElementById('btn-token').classList.remove('hidden');
                return;
            }
            if (xhr.status >= 200 && xhr.status < 300) {
                var data = JSON.parse(xhr.responseText);
                toast('Импортировано устройств: ' + data.devices +
                    '. Копия прежней базы: ' + data.backup);
                loadDevices();
                return;
            }
            var message = 'HTTP ' + xhr.status;
            try {
                var parsed = JSON.parse(xhr.responseText);
                if (parsed && parsed.error && parsed.error.message) message = parsed.error.message;
            } catch (e) {}
            toast(message, true);
        };
        xhr.onerror = function () {
            toast('Нет связи с сервером', true);
        };
        xhr.send(form);
    });
});

loadDevices();
</script>
</body>
</html>
